name: Release

# Builds the Linux packages, installs the amd64 one on every Ubuntu LTS in use
# as a smoke test, and publishes a release only if those installs work.
#
# main: publishes v<product_version> when no such release exists yet, so a
#       release is cut by changing internal/config/product_version.
# tags: a pushed vX.Y.Z tag publishes that version.
# phase branches: a rehearsal that publishes nothing.
# Path filters do not apply to tag pushes.
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
      - "p[0-9]*/**"
    paths:
      - ".github/workflows/release.yml"
      - "install.sh"
      - "manifold.sh"
      - "manifold.service"
      - "DockerInit.sh"
      # What the smoke test drives under the unit: the engines and their scripts,
      # and what its browser opens: the pages and the links they are given.
      - "deploy/test/*e2e*.sh"
      - "deploy/test/panel-ui.cjs"
      - "frontend/src/**"
      - "internal/sub/**"
      - "internal/openvpn/**"
      - "internal/wgquick/**"
      - "internal/l2tp/**"
      - "internal/egress/**"
      - "internal/tunnel/**"
      - "internal/config/product_version"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        platform:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    # A stalled toolchain download must not hold a runner for the default six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the product version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(tr -d '[:space:]' < internal/config/product_version)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match internal/config/product_version ($want)" >&2
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # go:embed needs internal/web/dist, which only the interface build creates.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the interface
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build the panel
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # A static musl build runs on every distribution, whatever its libc version.
          case "$PLATFORM" in
            amd64) BOOTLIN_ARCH="x86-64" ;;
            arm64) BOOTLIN_ARCH="aarch64" ;;
          esac
          base="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
          tarball=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "$base" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\.tar\.xz" | sort -r | head -n1)
          [ -n "$tarball" ] || { echo "no musl toolchain found for $BOOTLIN_ARCH" >&2; exit 1; }
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "/tmp/$tarball" "$base$tarball"
          tar -xf "/tmp/$tarball" -C /tmp
          toolchain=$(find /tmp -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          CC=$(find "$toolchain/bin" -name '*-gcc.br_real' -type f -executable | head -n1)
          [ -n "$CC" ] || { echo "no compiler in $toolchain" >&2; exit 1; }
          export CC PATH="$toolchain/bin:$PATH"
          export CGO_ENABLED=1 GOOS=linux GOARCH="$PLATFORM"
          mkdir -p build
          go build -buildvcs=true -ldflags "-w -s -linkmode external -extldflags '-static'" -o build/manifold .
          file build/manifold

      - name: Assemble the package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ./DockerInit.sh "$PLATFORM"
          mkdir -p package/manifold
          cp -r build/manifold build/bin package/manifold/
          cp install.sh manifold.sh manifold.service LICENSE NOTICE package/manifold/
          tar -C package -czf "manifold-linux-$PLATFORM.tar.gz" manifold
          sha256sum "manifold-linux-$PLATFORM.tar.gz" > "manifold-linux-$PLATFORM.tar.gz.sha256"
          tar -tzf "manifold-linux-$PLATFORM.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: manifold-linux-${{ matrix.platform }}
          path: |
            manifold-linux-${{ matrix.platform }}.tar.gz
            manifold-linux-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  # Installs the package the way a server owner does, on every Ubuntu LTS in
  # use, and drives each engine with real clients while the panel runs under
  # its unit: what the sandbox forbids only shows there.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The installed panel, for the scripts that drive it instead of one of their own.
    # They get it through "sudo env": sudo on Ubuntu 26.04 has no -E.
    env:
      INSTALLED_PANEL: PANEL_URL=http://192.168.251.1:20530/smoke PANEL_USER=smoke PANEL_PASSWORD=smoke-pass-123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: manifold-linux-amd64

      - name: Install the package
        run: |
          set -euo pipefail
          # Another panel's subscription server usually holds port 2096: the
          # install must still give a working panel, with its own port moved.
          python3 -m http.server 2096 >/dev/null 2>&1 &
          other_panel=$!
          sleep 1
          sudo bash install.sh --package manifold-linux-amd64.tar.gz \
            --port 20530 --path /smoke/ --username smoke --password smoke-pass-123 | tee /tmp/install.log
          grep -q "Subscriptions use port" /tmp/install.log
          kill "$other_panel"
          systemctl is-active manifold
          code=000
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:20530/smoke/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            sudo journalctl -u manifold -n 80 --no-pager
            echo "the panel did not answer on its port (last status $code)" >&2
            exit 1
          fi
          jar=$(mktemp)
          token=$(curl -fsS -c "$jar" http://127.0.0.1:20530/smoke/csrf-token | sed -E 's/.*"obj":"([^"]+)".*/\1/')
          curl -fsS -b "$jar" -c "$jar" -H "X-CSRF-Token: $token" \
            -d 'username=smoke&password=smoke-pass-123' http://127.0.0.1:20530/smoke/login | tee /tmp/login.json
          grep -q '"success":true' /tmp/login.json
          test "$(sudo manifold version)" = "$(tr -d '[:space:]' < internal/config/product_version)"
          sudo manifold settings
          # The unit's sandbox must let the panel run the engines the installer
          # brought in: an OpenVPN inbound has to end up listening, with its NAT.
          token=$(curl -fsS -b "$jar" -c "$jar" http://127.0.0.1:20530/smoke/csrf-token | sed -E 's/.*"obj":"([^"]+)".*/\1/')
          curl -fsS -b "$jar" -c "$jar" -H "X-CSRF-Token: $token" -H 'Content-Type: application/json' \
            -d '{"remark":"smoke","enable":true,"port":21195,"protocol":"openvpn","settings":"{\"clients\":[{\"email\":\"smoke\",\"enable\":true}]}"}' \
            http://127.0.0.1:20530/smoke/panel/api/inbounds/add | tee /tmp/inbound.json
          grep -q '"success":true' /tmp/inbound.json
          listening=no
          for _ in $(seq 1 20); do
            if sudo ss -lun | grep -q ':21195 '; then listening=yes; break; fi
            sleep 1
          done
          if [ "$listening" != yes ]; then
            sudo journalctl -u manifold -n 80 --no-pager
            echo "the OpenVPN inbound is not listening" >&2
            exit 1
          fi
          sudo nft list table ip manifold_ovpn1 >/dev/null
          # A WireGuard inbound is an interface the sandboxed panel brings up from
          # /etc/wireguard, on the kernel module the sandbox must still let load.
          wg_body=$(python3 -c 'import json, sys; print(json.dumps({"remark": "smoke-wg", "enable": True, "port": 21196, "protocol": "wireguard", "settings": json.dumps({"secretKey": sys.argv[1], "clients": []})}))' "$(wg genkey)")
          curl -fsS -b "$jar" -c "$jar" -H "X-CSRF-Token: $token" -H 'Content-Type: application/json' \
            -d "$wg_body" http://127.0.0.1:20530/smoke/panel/api/inbounds/add > /tmp/wg-inbound.json
          grep -q '"success":true' /tmp/wg-inbound.json
          wg_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["obj"]["id"])' /tmp/wg-inbound.json)
          up=no
          for _ in $(seq 1 20); do
            if ip link show "mfwg${wg_id}" >/dev/null 2>&1; then up=yes; break; fi
            sleep 1
          done
          if [ "$up" != yes ]; then
            sudo journalctl -u manifold -n 80 --no-pager
            echo "the WireGuard inbound has no interface" >&2
            exit 1
          fi
          sudo grep -q "^# Managed by Manifold: inbound ${wg_id}\." "/etc/wireguard/mfwg${wg_id}.conf"
          test "$(sudo wg show "mfwg${wg_id}" listen-port)" = 21196
          sudo nft list table ip "manifold_wg${wg_id}" >/dev/null

      - name: The installer set up the services L2TP needs
        run: |
          systemctl is-active strongswan
          if systemctl is-active --quiet xl2tpd; then
            systemctl status xl2tpd --no-pager || true
            echo "the distribution's xl2tpd service still holds the L2TP port" >&2
            exit 1
          fi

      - name: OpenVPN clients against the installed service
        run: sudo env $INSTALLED_PANEL deploy/test/openvpn-e2e.sh /usr/local/manifold/manifold

      - name: WireGuard peers against the installed service, with a takeover
        run: sudo env $INSTALLED_PANEL deploy/test/wireguard-e2e.sh /usr/local/manifold/manifold

      - name: An L2TP client through IPsec against the installed service
        run: |
          # Where the kernel can carry L2TP sessions itself, the sandbox must let it.
          kernel_l2tp=0
          if sudo modinfo l2tp_ppp >/dev/null 2>&1; then kernel_l2tp=1; fi
          echo "kernel $(uname -r), L2TP sessions in the kernel: $kernel_l2tp"
          sudo env $INSTALLED_PANEL EXPECT_KERNEL_L2TP="$kernel_l2tp" deploy/test/l2tp-e2e.sh /usr/local/manifold/manifold

      # The pages are the same on every system, so one of the three opens them.
      - uses: actions/setup-node@v7
        if: matrix.os == 'ubuntu-26.04'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: What an admin sees after creating inbounds and a client, in a browser
        if: matrix.os == 'ubuntu-26.04'
        run: |
          set -euo pipefail
          (cd frontend && npm ci && npx playwright install --with-deps chromium)
          PANEL_URL=http://127.0.0.1:20530/smoke PANEL_USER=smoke PANEL_PASSWORD=smoke-pass-123 node deploy/test/panel-ui.cjs

      - name: A full backup made by the installed service restores on it
        run: |
          set -euo pipefail
          base=http://127.0.0.1:20530/smoke
          jar=$(mktemp)
          login() {
            local t
            t=$(curl -fsS -c "$jar" -b "$jar" "$base/csrf-token" | sed -E 's/.*"obj":"([^"]+)".*/\1/')
            curl -fsS -b "$jar" -c "$jar" -H "X-CSRF-Token: $t" -d 'username=smoke&password=smoke-pass-123' "$base/login" | grep -q '"success":true'
            token=$(curl -fsS -b "$jar" -c "$jar" "$base/csrf-token" | sed -E 's/.*"obj":"([^"]+)".*/\1/')
          }
          count() { curl -fsS -b "$jar" "$base/panel/api/inbounds/list" | python3 -c 'import json, sys; print(len(json.load(sys.stdin)["obj"]))'; }
          login
          before=$(count)
          curl -fsS -b "$jar" -o /tmp/full.tar.gz "$base/panel/api/server/getFullBackup"
          tar -tzf /tmp/full.tar.gz > /tmp/full.list
          grep -qx manifest.json /tmp/full.list
          grep -qx database.db /tmp/full.list
          curl -fsS -b "$jar" -H "X-CSRF-Token: $token" -F backup=@/tmp/full.tar.gz "$base/panel/api/server/inspectBackup" > /tmp/inspect.json
          python3 -c 'import json, sys; r = json.load(open(sys.argv[1])); assert r["success"], r; o = r["obj"]; assert o["inbounds"] == int(sys.argv[2]), o; assert not [i for i in o["issues"] if i["level"] == "error"], o["issues"]' /tmp/inspect.json "$before"
          curl -fsS -b "$jar" -H "X-CSRF-Token: $token" -F backup=@/tmp/full.tar.gz -F keepPanelAccess=true "$base/panel/api/server/restoreBackup" > /tmp/restore.json
          grep -q '"success":true' /tmp/restore.json
          sleep 8
          for _ in $(seq 1 20); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/")" = 200 ] && break
            sleep 1
          done
          systemctl is-active manifold
          login
          test "$(count)" = "$before"

      - name: Update in place, then uninstall
        run: |
          set -euo pipefail
          wg_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["obj"]["id"])' /tmp/wg-inbound.json)
          # An update must keep the database: the second run is an update in place.
          sudo bash install.sh --package manifold-linux-amd64.tar.gz
          settings=$(sudo manifold settings)
          grep -q 'port: 20530' <<<"$settings"
          grep -q 'webBasePath: /smoke/' <<<"$settings"
          sudo manifold uninstall --purge
          test ! -e /usr/local/manifold
          # The interface's config held a private key in a folder that is not the panel's.
          if sudo test -e "/etc/wireguard/mfwg${wg_id}.conf"; then
            echo "the uninstall left the WireGuard inbound's config behind" >&2
            exit 1
          fi
          # With the panel port held by another program the installer must fail
          # instead of printing an address nobody can reach.
          python3 -m http.server 20531 >/dev/null 2>&1 &
          squatter=$!
          sleep 1
          if sudo bash install.sh --package manifold-linux-amd64.tar.gz \
            --port 20531 --path /smoke/ --username smoke --password smoke-pass-123 2>/tmp/install-err.log; then
            echo "the installer reported success for a panel that cannot listen" >&2
            exit 1
          fi
          grep -q "not listening on port 20531" /tmp/install-err.log
          kill "$squatter"
          sudo manifold uninstall --purge

  publish:
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=v$(tr -d '[:space:]' < internal/config/product_version)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo none)
          case "$assets" in
            none)
              gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "Manifold $VERSION" \
                --notes "Install or update with install.sh. See manifold/docs/installation.md." \
                --latest packages/*
              ;;
            0)
              # A release drafted on GitHub exists without packages: attach them.
              gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" packages/*
              ;;
            *)
              echo "$VERSION is already published with $assets files; a new release needs a new product_version."
              ;;
          esac

  # The command in the README, run on a clean machine against the published release.
  install-from-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the published release
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          sudo bash install.sh --version "$VERSION"
          systemctl is-active manifold
          test "v$(sudo manifold version)" = "$VERSION"
          settings=$(sudo manifold settings)
          port=$(sed -n 's/^port: //p' <<<"$settings")
          path=$(sed -n 's/^webBasePath: //p' <<<"$settings")
          code=000
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}${path}" || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            sudo journalctl -u manifold -n 80 --no-pager
            echo "the installed panel did not answer on port ${port} (last status $code)" >&2
            exit 1
          fi
